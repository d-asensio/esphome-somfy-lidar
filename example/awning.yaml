# Somfy RTS awning with its position measured by a TF-Luna lidar.
# https://github.com/d-asensio/esphome-somfy-lidar
#
# Hardware: Seeed Studio XIAO ESP32-C3, Ebyte E07-M1101D-SMA (CC1101, 433 MHz)
# with a 433 MHz antenna, and a Benewake TF-Luna in I2C mode.
#
# Wiring (XIAO pin labels, GPIO in brackets):
#   E07-M1101D   VCC->3V3  GND->GND  SCK->D8 (GPIO8)  MISO->D9 (GPIO9)
#                MOSI->D10 (GPIO10)  CSN->D3 (GPIO5)  GDO0->D2 (GPIO4)
#                GDO2 not connected
#   TF-Luna      1 (5V)->5V  2 (SDA)->D4 (GPIO6)  3 (SCL)->D5 (GPIO7)
#                4 (GND)->GND  5 (CFG)->GND to select I2C  6 not connected
#   Plug the 2.4 GHz antenna that comes with the XIAO into its U.FL connector.
#
# Everything above the "Awning" section is standard ESPHome setup.

esphome:
  name: awning
  friendly_name: Awning
  min_version: 2026.9.0

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Awning Fallback

captive_portal:

# ---------------------------------------------------------------- Buses

# CC1101 radio, on the XIAO's labelled SPI pins. GPIO8 and GPIO9 are strapping
# pins; the CC1101 leaves them alone at boot, so they are safe to use here.
spi:
  clk_pin:
    number: GPIO8  # D8
    ignore_strapping_warning: true
  miso_pin:
    number: GPIO9  # D9
    ignore_strapping_warning: true
  mosi_pin: GPIO10  # D10

# TF-Luna lidar, on the XIAO's labelled I2C pins.
i2c:
  sda: GPIO6  # D4
  scl: GPIO7  # D5
  frequency: 100kHz

# ---------------------------------------------------------------- Awning

external_components:
  - source: github://d-asensio/esphome-somfy-lidar@main
    components: [somfy_lidar]

somfy_lidar:
  # Address of the ESP's own virtual remote: any random 24-bit hex value that
  # differs from your other remotes. Pair it once with the "Send PROG" button.
  remote_address: 0x1A2B3C  # !!! CHANGE ME !!!

  # CC1101 pins outside the SPI bus.
  cs_pin: GPIO5    # D3
  gdo0_pin: GPIO4  # D2

  # Which button extends the awning. Change to UP if "open" retracts it.
  open_command: DOWN

  # No TF-Luna yet? Set this to false: the awning then only opens and closes
  # fully (no position or stop), and the i2c: block above can be removed.
  # lidar: false

  # Everything else is optional; see the README for all options.
