# Somfy RTS awning with closed-loop positioning from a TF-Luna lidar.
# https://github.com/d-asensio/esphome-somfy-lidar
#
# Wiring (ESP32 DevKit; the CC1101 pins match ESPSomfy RTS defaults):
#   CC1101  SCK->GPIO18  MISO->GPIO19  MOSI->GPIO23  CSN->GPIO5  GDO0->GPIO13  VCC->3V3
#   TF-Luna pin1 5V   pin2 TX->GPIO16   pin3 RX->GPIO17   pin4 GND   pin5 (CFG) unconnected
# See the README for pairing and calibration.

substitutions:
  name: awning
  friendly_name: Awning

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: d-asensio.esphome-somfy-lidar
    version: "0.1.0"
  on_boot:
    # The transceiver starts in RX and drives GDO0; keep it idle until we transmit.
    priority: -100
    then:
      - cc1101.set_idle: radio

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://d-asensio/esphome-somfy-lidar@main
    components: [somfy_rts, tfluna, somfy_awning]

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome  # authenticated with the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:

# ---------------------------------------------------------------- Radio

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

cc1101:
  id: radio
  cs_pin: GPIO5
  frequency: 433.42MHz  # Somfy RTS, not the usual 433.92MHz
  modulation_type: ASK/OOK
  output_power: 10

remote_transmitter:
  id: rf_tx
  pin: GPIO13  # CC1101 GDO0
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx: radio
  on_complete:
    then:
      - cc1101.set_idle: radio

somfy_rts:
  id: awning_remote
  transmitter_id: rf_tx
  # Any random 24-bit value, different from every other remote you own.
  address: 0x1A2B3C

# ---------------------------------------------------------------- Lidar

uart:
  id: lidar_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 115200

sensor:
  - platform: tfluna
    uart_id: lidar_uart
    update_interval: 100ms  # median of ~10 frames per reading
    distance:
      id: awning_distance
      name: Awning distance
      internal: true  # 10 readings/s is too chatty for Home Assistant
    signal_strength:
      name: Lidar signal strength
      filters:
        - throttle_average: 30s
    temperature:
      name: Lidar temperature
      filters:
        - throttle_average: 60s

  - platform: copy
    source_id: awning_distance
    name: Awning distance
    filters:
      - throttle_average: 5s

  - platform: template
    name: Awning stop latency
    entity_category: diagnostic
    unit_of_measurement: s
    accuracy_decimals: 2
    update_interval: 60s
    lambda: return id(awning).get_stop_latency();

# ---------------------------------------------------------------- Awning

cover:
  - platform: somfy_awning
    id: awning
    name: None  # the device name is the entity name
    distance_sensor: awning_distance
    open_command: DOWN  # change to UP if "open" retracts your awning

# ---------------------------------------------------------------- Setup buttons

button:
  - platform: template
    name: Calibrate
    icon: mdi:ruler
    entity_category: config
    on_press:
      - lambda: id(awning).start_calibration();

  - platform: template
    name: Set closed position here
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: id(awning).set_closed_here();

  - platform: template
    name: Set open position here
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: id(awning).set_open_here();

  # Pairing: hold PROG on a remote that already controls the awning until it
  # jogs, then press this within a few seconds. Pressing it again later unpairs.
  - platform: template
    name: Send PROG
    icon: mdi:remote
    entity_category: config
    disabled_by_default: true
    on_press:
      - somfy_rts.send:
          id: awning_remote
          command: PROG
          repeat: 7

  - platform: restart
    name: Restart
    entity_category: diagnostic
