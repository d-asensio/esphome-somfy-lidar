# Somfy RTS awning with its position measured by a TF-Luna lidar.
# https://github.com/d-asensio/esphome-somfy-lidar
#
# Hardware: ESP32-S3 board (8MB flash), Ebyte E07-M1101D-SMA (CC1101, 433 MHz)
# with a 433 MHz antenna, and a Benewake TF-Luna in I2C mode.
#
# Wiring:
#   E07-M1101D   VCC->3V3  GND->GND  SCK->GPIO12  MOSI->GPIO11  MISO->GPIO13
#                CSN->GPIO10  GDO0->GPIO9  (GDO2 unused)
#   TF-Luna      1 (5V)->5V  2 (SDA)->GPIO4  3 (SCL)->GPIO5  4 (GND)->GND
#                5 (CFG)->GND to select I2C  (6 unused)
#
# Everything above the "Awning" section is standard ESPHome setup.

esphome:
  name: awning
  friendly_name: Awning
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Awning Fallback

captive_portal:

# ---------------------------------------------------------------- Buses

# CC1101 radio
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

# TF-Luna lidar
i2c:
  sda: GPIO4
  scl: GPIO5
  frequency: 100kHz

# ---------------------------------------------------------------- Awning

external_components:
  - source: github://d-asensio/esphome-somfy-lidar@main
    components: [somfy_lidar]

somfy_lidar:
  # Address of the ESP's own virtual remote: any random 24-bit hex value that
  # differs from your other remotes. Pair it once with the "Send PROG" button.
  remote_address: 0x1A2B3C  # !!! CHANGE ME !!!

  # CC1101 pins outside the SPI bus.
  cs_pin: GPIO10
  gdo0_pin: GPIO9

  # Which button extends the awning. Change to UP if "open" retracts it.
  open_command: DOWN

  # Everything else is optional; see the README for all options.
